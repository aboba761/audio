    <script>
        (function() {
            const audio = document.getElementById('bgAudio');

            // Function to start audio playback
            function playAudio() {
                audio.play().then(() => {
                    // Audio started successfully, remove event listeners
                    removeAllListeners();
                }).catch((err) => {
                    // Browser blocked autoplay until user interaction
                });
            }

            function removeAllListeners() {
                window.removeEventListener('click', playAudio);
                window.removeEventListener('touchstart', playAudio);
                window.removeEventListener('keydown', playAudio);
                window.removeEventListener('scroll', playAudio);
            }

            // Attempt direct playback instantly on load
            playAudio();

            // Fallback: Trigger immediately on any first user interaction (click, tap, key, scroll)
            window.addEventListener('click', playAudio, { once: true });
            window.addEventListener('touchstart', playAudio, { once: true });
            window.addEventListener('keydown', playAudio, { once: true });
            window.addEventListener('scroll', playAudio, { once: true });
        })();
    </script>
